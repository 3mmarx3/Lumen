<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lumen — Photo Gallery</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/style/main.css">
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
  }
</script>


</head>

<body class="font-sans antialiased">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <aside class="glass fixed z-40 rounded-[28px] p-2 flex flex-row gap-2 items-center justify-around md:justify-start overflow-x-auto no-scrollbar
                bottom-3 inset-x-3
                md:top-4 md:bottom-4 md:left-4 md:inset-x-auto md:w-[72px] md:flex-col md:py-4 md:overflow-x-visible md:overflow-y-auto">
    <div class="hidden md:flex shrink-0 w-11 h-11 rounded-3xl bg-slate-900 text-white items-center justify-center mb-1">
      <i class="fa-solid fa-camera-retro"></i>
    </div>

    <button id="railSearch" class="md:hidden tap shrink-0 w-12 h-12 rounded-3xl bg-slate-900 text-white flex items-center justify-center" title="Search" aria-label="Open search"><i class="fa-solid fa-magnifying-glass text-lg"></i></button>

    <button data-nav="latest" class="rail tap shrink-0 w-12 h-12 rounded-3xl flex items-center justify-center" title="Latest" aria-label="Latest"><i class="fa-solid fa-clock-rotate-left text-lg"></i></button>
    <button data-nav="surprise" class="rail tap shrink-0 w-12 h-12 rounded-3xl flex items-center justify-center" title="Surprise me" aria-label="Surprise me"><i class="fa-solid fa-shuffle text-lg"></i></button>
    <button data-nav="favorites" class="rail tap relative shrink-0 w-12 h-12 rounded-3xl flex items-center justify-center" title="Favorites" aria-label="Favorites">
      <i class="fa-solid fa-heart text-lg"></i>
      <span id="favBadge" class="hidden absolute -top-1 -right-1 min-w-[20px] h-5 px-1 rounded-full bg-rose-500 text-white text-[11px] font-bold items-center justify-center">0</span>
    </button>

    <div class="shrink-0 w-px h-8 md:w-8 md:h-px bg-slate-300/70"></div>

    <div id="tabs" class="contents"></div>

    <div class="hidden md:block shrink-0 w-px h-8 md:w-8 md:h-px bg-slate-300/70"></div>
    <button id="toTop" class="rail tap hidden md:flex shrink-0 w-12 h-12 rounded-3xl flex items-center justify-center" title="Back to top" aria-label="Back to top"><i class="fa-solid fa-arrow-up text-lg"></i></button>
  </aside>

  <div class="relative z-10 md:pl-[104px]">
    <main class="px-4 md:pr-4 pt-8 md:pt-10 pb-32 md:pb-36">
      <div class="flex flex-wrap items-end justify-between gap-4 mb-5 px-1">
        <div>
          <h1 id="title" class="text-3xl md:text-4xl font-extrabold tracking-tight">Discover</h1>
          <p id="subtitle" class="text-sm text-slate-500 mt-1 font-medium">&nbsp;</p>
        </div>
        <div class="flex items-center gap-2">
          <div id="density" class="glass rounded-full p-1 flex gap-1" role="group" aria-label="Grid size">
            <button data-d="large"   class="seg tap rounded-full w-10 h-9 text-sm" title="Large"   aria-label="Large grid"><i class="fa-solid fa-table-cells-large"></i></button>
            <button data-d="cozy"    class="seg tap rounded-full w-10 h-9 text-sm" title="Cozy"    aria-label="Cozy grid"><i class="fa-solid fa-table-cells"></i></button>
            <button data-d="compact" class="seg tap rounded-full w-10 h-9 text-sm" title="Compact" aria-label="Compact grid"><i class="fa-solid fa-grip"></i></button>
          </div>
          <button id="filterBtn" class="glass tap rounded-full px-5 h-11 text-sm font-semibold flex items-center gap-2" aria-haspopup="dialog" aria-expanded="false">
            <i class="fa-solid fa-sliders"></i> Filters
            <span id="filterCount" class="hidden min-w-[20px] h-5 px-1 rounded-full bg-slate-900 text-white text-[11px] items-center justify-center">0</span>
          </button>
        </div>
      </div>

      <section id="grid" data-d="cozy"></section>

      <div id="sentinel" class="h-24 flex items-center justify-center text-slate-400 text-sm font-medium">
        <span id="spinner" class="hidden items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading more photos</span>
        <span id="end" class="hidden">You’ve seen everything for this search.</span>
      </div>
    </main>
  </div>

  <div id="sxBack" class="backdrop hidden z-[65] md:hidden"></div>
  <div id="sbar">
    <div class="sbcard">
      <div class="sbhead">
        <span>Search photos</span>
        <button type="button" id="sbClose" class="w-9 h-9 rounded-full text-slate-500 tap" aria-label="Close search"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="searchForm" role="search" class="glass rounded-full flex items-center gap-3 pl-5 pr-2 py-1.5">
        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
        <label class="flex-1 min-w-0">
          <span class="sr-only">Search photos</span>
          <input id="searchInput" type="text" autocomplete="off" placeholder="Search free photos"
            class="w-full bg-transparent py-2.5 text-[15px] font-medium placeholder-slate-400 focus:outline-none">
        </label>
        <kbd class="hidden md:inline">/</kbd>
        <button type="button" id="clearBtn" class="hidden w-9 h-9 rounded-full text-slate-400 hover:text-slate-900 tap" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
        <button type="submit" class="tap bg-slate-900 text-white rounded-full px-5 h-11 text-sm font-semibold">Search</button>
      </form>
    </div>
  </div>

  <div id="filters" class="hidden fixed inset-0 z-[70] items-end md:items-center justify-center md:p-4 bg-slate-900/35 backdrop-blur-md" role="dialog" aria-modal="true" aria-label="Filters">
    <div class="fpanel pop-in glass w-full md:max-w-3xl h-[88vh] md:h-[580px] max-h-[92vh] flex flex-col rounded-t-[28px] md:rounded-[32px] overflow-hidden">

      <div class="flex items-center justify-between px-6 pt-5 pb-3 shrink-0">
        <div>
          <h2 class="text-xl font-extrabold leading-tight">Filters</h2>
          <p class="text-xs text-slate-500 font-semibold">Refine your results</p>
        </div>
        <button id="fClose" class="tap w-10 h-10 rounded-full text-slate-500 hover:text-slate-900" aria-label="Close filters"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="flex flex-col md:flex-row flex-1 min-h-0 border-t border-slate-300/40">
        <nav id="fNav" class="flex md:flex-col gap-1.5 p-3 md:p-4 md:w-64 shrink-0 overflow-x-auto md:overflow-y-auto no-scrollbar border-b md:border-b-0 md:border-r border-slate-300/40" aria-label="Filter sections"></nav>
        <div id="fPane" class="flex-1 min-w-0 overflow-y-auto p-5 md:p-8"></div>
      </div>

      <div class="flex items-center justify-between gap-3 px-6 py-4 border-t border-slate-300/40 shrink-0">
        <button id="fReset" class="tap text-sm font-bold text-slate-600 hover:text-slate-900 px-2 py-2 flex items-center gap-2"><i class="fa-solid fa-rotate-left"></i> Clear all</button>
        <button id="fDone" class="tap bg-slate-900 text-white rounded-full px-7 h-12 text-sm font-bold">Show results</button>
      </div>
    </div>
  </div>

  <div id="lb" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-slate-950/70 backdrop-blur-xl" role="dialog" aria-modal="true" aria-label="Photo preview">

    <div class="absolute top-0 inset-x-0 z-10 flex items-center justify-between gap-3 p-3 md:p-5 pointer-events-none">
      <div class="glass-photo pointer-events-auto rounded-full pl-1.5 pr-4 py-1.5 flex items-center gap-2.5 min-w-0 max-w-[72%]">
        <img id="lbAvatar" src="" alt="" class="w-9 h-9 rounded-full object-cover bg-white/30 shrink-0">
        <div class="min-w-0 leading-tight">
          <p id="lbUser" class="text-sm font-bold truncate"></p>
          <p id="lbSize" class="text-[11px] opacity-75"></p>
        </div>
      </div>
      <button id="lbClose" class="glass-photo pointer-events-auto tap w-11 h-11 rounded-full shrink-0" aria-label="Close preview"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div id="lbStage" class="relative w-full flex-1 min-h-0 flex items-center justify-center overflow-hidden px-3 pt-20 pb-28 md:px-24">
      <img id="lbImg" src="" alt="" draggable="false" class="select-none rounded-3xl md:rounded-3xl shadow-2xl" style="max-width:100%;max-height:100%;object-fit:contain">
    </div>

    <button id="lbPrev" class="glass-photo tap absolute left-2 md:left-8 top-1/2 -translate-y-1/2 w-11 h-11 md:w-12 md:h-12 rounded-full z-10" aria-label="Previous photo"><i class="fa-solid fa-chevron-left"></i></button>
    <button id="lbNext" class="glass-photo tap absolute right-2 md:right-8 top-1/2 -translate-y-1/2 w-11 h-11 md:w-12 md:h-12 rounded-full z-10" aria-label="Next photo"><i class="fa-solid fa-chevron-right"></i></button>

    <div class="absolute bottom-4 md:bottom-6 inset-x-0 z-10 flex justify-center px-3 pointer-events-none">
      <div class="glass-photo pointer-events-auto rounded-full p-1.5 flex items-center gap-1.5">
        <button id="lbPlay" class="tap w-11 h-11 rounded-full hover:bg-white/20" title="Slideshow (S)" aria-label="Toggle slideshow"><i class="fa-solid fa-play"></i></button>
        <button id="lbLink" class="tap w-11 h-11 rounded-full hover:bg-white/20" title="Copy link" aria-label="Copy link"><i class="fa-solid fa-link"></i></button>
        <button id="lbFav" class="tap w-11 h-11 rounded-full hover:bg-white/20" title="Favorite (F)" aria-label="Save to favorites"></button>
        <button id="lbDl" class="tap bg-white text-slate-900 rounded-full px-5 h-11 text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-download"></i> Download</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed z-[90] left-1/2 -translate-x-1/2 bottom-24 md:bottom-24 glass rounded-full px-5 py-3 text-sm font-semibold items-center gap-2"></div>


  <script src="./assets/script/app.js"></script>
</body>
</html>
